name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check taurus_gcfd.py app/app.py examples/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy matplotlib pytest
      - name: Run pytest suite
        run: python -m pytest tests/ -v
      - name: Run example script
        run: python examples/basic_usage.py

  ip-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IP guard scan
        run: |
          BLOCKED_TERMS="PosnerQPUSimulator|AKQS|HQGP|NACRS|HederaHCSMock|DQSB_MasterController|DQSBOrchestrator|PQCLayer|viscoelastic|sol-gel|decay_constant|55\.4|Kyber|Posner.*qubit"
          MATCHES=$(grep -rn -E "$BLOCKED_TERMS" --include="*.py" --include="*.md" --exclude-dir=.git --exclude=".gitignore" --exclude="ip_guard_hook.sh" . || true)
          if [ -n "$MATCHES" ]; then
            echo "IP GUARD VIOLATION"
            echo "$MATCHES"
            exit 1
          else
            echo "IP guard: CLEAN"
          fi
